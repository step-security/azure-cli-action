name: Check dist

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  check-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm install

      - name: Build dist
        run: npm run build

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --ignore-space-at-eol dist/)" ]; then
            echo "::error::dist/ is out of sync with source. Run 'npm run build' and commit the result."
            git diff dist/
            exit 1
          fi
